<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>doc-kit math check</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<script src="../vendor/katex/katex.min.js"></script>
<script type="module">
  // Driven by tools/check_math.py: renders math assets with KaTeX in strict mode.
  import { expandMath, parseMacros } from '../math.js';
  const text = async (url) => {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
    return r.text();
  };
  window.checkMath = async ({ mathUrl, macrosUrl, prefix, items }) => {
    const macros = macrosUrl ? parseMacros(await text(macrosUrl)) : {};
    const results = [];
    for (const { name, params } of items) {
      try {
        const tex = await expandMath(name, params, { prefix, load: (n) => text(new URL(`${n}.tex`, mathUrl)) });
        katex.renderToString(tex, { displayMode: true, throwOnError: true, strict: 'error', trust: false, macros: { ...macros } });
        results.push({ name, params, ok: true });
      } catch (err) {
        results.push({ name, params, ok: false, error: String(err.message || err) });
      }
    }
    return results;
  };
  window.checkReady = true;
</script>
</head>
<body></body>
</html>
